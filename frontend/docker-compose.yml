version: '3.8'

services:
  # Frontend application
  chatbi-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_MCP_BASE_URL: /mcp
        VITE_APP_TITLE: ChatBI Agent
        VITE_APP_VERSION: 0.1.0
    ports:
      - "3000:80"
    depends_on:
      - bff-server
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - chatbi-network

  # BFF Server (mock for now)
  bff-server:
    build:
      context: .
      dockerfile: Dockerfile.bff
    ports:
      - "8001:8001"
    environment:
      - NODE_ENV=production
      - PORT=8001
      - MCP_SERVER_URL=http://mcp-server:8000
    restart: unless-stopped
    networks:
      - chatbi-network

  # MCP Server (placeholder)
  mcp-server:
    image: chatbi-mcp-server:latest
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/chatbi
      - LOG_LEVEL=info
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - chatbi-network

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=chatbi
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - chatbi-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - chatbi-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  chatbi-network:
    driver: bridge